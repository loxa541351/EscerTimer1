          { range: '30~45分', min: 30, max: 45, items: ['看完 OP3 錄影帶按門鈴敲門', '拿轉軸斷床上怪物的頭打開衣櫃', '用電線（抽屜）插電，電死怪物', '拼出拼布 0371，拿到 OP4 錄影帶'] },
          { range: '45~50分', min: 45, max: 50, items: ['看完 OP4 錄影帶', '用營釘戳海盜桶', '拿到恭喜過關鑰匙打開大門', '噴煙及開紫光燈', '鏡櫃左下暗鎖打開找到規則及死法'] },
          { range: '50~60分', min: 50, max: 60, items: ['找出邪咒曲的旋律（水絞斷雷刃毒）', '反彈邪咒曲（DAEDEB）'] }
        ]
      }
    ];

    const MAX_SECONDS = 3600;
    const STORAGE_KEY = 'escapeholic_rooms_state_v1';

    const createInitialState = () => {
      const initial = {};
      ROOMS_DATA.forEach((r) => {
        initial[r.id] = {
          status: 'idle',
          startTime: null,
          accumulatedSeconds: 0,
          manualStageIndex: -1,
          updatedAt: Date.now()
        };
      });
      return initial;
    };

    function App() {
      const [now, setNow] = useState(Date.now());
      const [roomsState, setRoomsState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return { ...createInitialState(), ...JSON.parse(saved) };
        } catch (e) {}
        return createInitialState();
      });

      const [resetConfirmRoomId, setResetConfirmRoomId] = useState(null);
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [syncStatus, setSyncStatus] = useState('connecting'); // 'connecting' | 'connected' | 'error'
      const [syncErrorMsg, setSyncErrorMsg] = useState('');

      const fbDbRef = useRef(null);
      const bcRef = useRef(null);

      // 每 250ms 更新一次時鐘
      useEffect(() => {
        const timer = setInterval(() => setNow(Date.now()), 250);
        return () => clearInterval(timer);
      }, []);

      // 本機分頁同步
      useEffect(() => {
        if ('BroadcastChannel' in window) {
          const bc = new BroadcastChannel('escapeholic_sync_channel');
          bc.onmessage = (ev) => {
            if (ev.data && ev.data.type === 'SYNC_STATE') {
              setRoomsState(ev.data.payload);
            }
          };
          bcRef.current = bc;
          return () => bc.close();
        }
      }, []);

      // 初始化 Firebase Realtime Database 連線
      useEffect(() => {
        const initFirebase = async () => {
          try {
            if (!window.firebase) {
              await new Promise((res, rej) => {
                const s1 = document.createElement('script');
                s1.src = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js';
                s1.onload = res;
                s1.onerror = rej;
                document.head.appendChild(s1);
              });
              await new Promise((res, rej) => {
                const s2 = document.createElement('script');
                s2.src = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js';
                s2.onload = res;
                s2.onerror = rej;
                document.head.appendChild(s2);
              });
            }

            if (!window.firebase.apps.length) {
              window.firebase.initializeApp(DEFAULT_FIREBASE_CONFIG);
            }
            const db = window.firebase.database();
            const roomRef = db.ref('escapeholic_dashboard_v1/rooms');
            fbDbRef.current = roomRef;

            roomRef.on(
              'value',
              (snapshot) => {
                const data = snapshot.val();
                if (data) {
                  setRoomsState((prev) => ({ ...prev, ...data }));
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } else {
                  roomRef.set(roomsState);
                }
                setSyncStatus('connected');
                setSyncErrorMsg('');
              },
              (err) => {
                setSyncStatus('error');
                setSyncErrorMsg(err.message || '無法讀寫資料庫，請確認 Firebase Rules 是否已設為 true');
              }
            );
          } catch (e) {
            setSyncStatus('error');
            setSyncErrorMsg('載入 Firebase SDK 失敗，請檢查網路連線。');
          }
        };

        initFirebase();

        return () => {
          if (fbDbRef.current) fbDbRef.current.off();
        };
      }, []);

      const updateRoomState = (roomId, updater) => {
        setRoomsState((prev) => {
          const currentRoom = prev[roomId] || createInitialState()[roomId];
          const nextRoom = typeof updater === 'function' ? updater(currentRoom) : { ...currentRoom, ...updater };
          const updatedAll = {
            ...prev,
            [roomId]: { ...nextRoom, updatedAt: Date.now() }
          };

          localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedAll));
          if (bcRef.current) {
            bcRef.current.postMessage({ type: 'SYNC_STATE', payload: updatedAll });
          }
          if (fbDbRef.current && syncStatus === 'connected') {
            fbDbRef.current.child(roomId).set(updatedAll[roomId]);
          }
          return updatedAll;
        });
      };

      const getElapsedSeconds = (roomState) => {
        if (!roomState) return 0;
        let total = roomState.accumulatedSeconds || 0;
        if (roomState.status === 'running' && roomState.startTime) {
          total += Math.floor((now - roomState.startTime) / 1000);
        }
        return Math.max(0, Math.min(MAX_SECONDS, total));
      };

      useEffect(() => {
        ROOMS_DATA.forEach((room) => {
          const st = roomsState[room.id];
          if (st && st.status === 'running') {
            const elapsed = getElapsedSeconds(st);
            if (elapsed >= MAX_SECONDS) {
              updateRoomState(room.id, {
                status: 'timeout',
                startTime: null,
                accumulatedSeconds: MAX_SECONDS
              });
            }
          }
        });
      }, [now, roomsState]);

      const handleToggleStartPause = (roomId) => {
        const st = roomsState[roomId];
        const elapsed = getElapsedSeconds(st);
        if (elapsed >= MAX_SECONDS || st.status === 'timeout') return;

        if (st.status === 'running') {
          updateRoomState(roomId, {
            status: 'paused',
            startTime: null,
            accumulatedSeconds: elapsed
          });
        } else {
          updateRoomState(roomId, {
            status: 'running',
            startTime: Date.now(),
            accumulatedSeconds: elapsed
          });
        }
      };

      const handleAdjustMinute = (roomId, deltaMinutes) => {
        const st = roomsState[roomId];
        const elapsed = getElapsedSeconds(st);
        const nextSeconds = Math.max(0, Math.min(MAX_SECONDS, elapsed + deltaMinutes * 60));

        if (nextSeconds >= MAX_SECONDS) {
          updateRoomState(roomId, {
            status: 'timeout',
            startTime: null,
            accumulatedSeconds: MAX_SECONDS
          });
        } else {
          updateRoomState(roomId, {
            status: st.status === 'timeout' ? 'paused' : st.status,
            startTime: st.status === 'running' ? Date.now() : null,
            accumulatedSeconds: nextSeconds
          });
        }
      };

      const confirmResetRoom = () => {
        if (!resetConfirmRoomId) return;
        updateRoomState(resetConfirmRoomId, {
          status: 'idle',
          startTime: null,
          accumulatedSeconds: 0,
          manualStageIndex: -1
        });
        setResetConfirmRoomId(null);
      };

      const getAutoStageIndex = (room, elapsedSeconds) => {
        const currentMin = Math.floor(elapsedSeconds / 60);
        let idx = 0;
        for (let i = 0; i < room.stages.length; i++) {
          if (currentMin >= room.stages[i].min) {
            idx = i;
          }
        }
        return idx;
      };

      const formatMMSS = (totalSeconds) => {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      const currentClockStr = useMemo(() => {
        const d = new Date(now);
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        return `${hh}:${mm}:${ss}`;
      }, [now]);

      return (
        <div className="min-h-screen lg:h-screen w-full flex flex-col bg-[#07090e] text-slate-100 select-none lg:overflow-hidden">
          <header className="h-12 shrink-0 px-3 lg:px-5 bg-slate-950/90 border-b border-slate-800/80 flex items-center justify-between gap-2">
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_10px_#22d3ee]"></span>
                <h1 className="text-base lg:text-lg font-black tracking-wider text-white">
                  異世客計時系統
                </h1>
              </div>

              <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-900 border border-slate-700/80">
                {syncStatus === 'connected' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span className="w-2 h-2 rounded-full bg-emerald-400 -ml-3.5"></span>
                    <span className="text-emerald-300">Firebase 雲端即時同步中</span>
                  </>
                )}
                {syncStatus === 'connecting' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span className="text-amber-300">連線雲端中...</span>
                  </>
                )}
                {syncStatus === 'error' && (
                  <>
                    <span className="w-2 h-2 rounded-full bg-red-500"></span>
                    <span className="text-red-400" title={syncErrorMsg}>雲端連線異常（請檢查資料庫 Rules）</span>
                  </>
                )}
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 bg-slate-900/90 border border-slate-800 px-3 py-1 rounded-lg">
                <span className="text-[11px] text-slate-400 hidden sm:inline">現在時間</span>
                <span className="font-mono-timer text-sm lg:text-base font-bold text-cyan-300 tracking-wider">
                  {currentClockStr}
                </span>
              </div>
              <button
                onClick={() => setShowSyncModal(true)}
                className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition"
              >
                專案設定檢查
              </button>
            </div>
          </header>

          <main className="flex-1 p-2 lg:p-2.5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-2 lg:gap-2.5 lg:overflow-hidden">
            {ROOMS_DATA.map((room) => {
              const st = roomsState[room.id] || createInitialState()[room.id];
              const elapsed = getElapsedSeconds(st);
              const isTimeout = elapsed >= MAX_SECONDS || st.status === 'timeout';
              const isRunning = st.status === 'running' && !isTimeout;
              const isPaused = st.status === 'paused' && !isTimeout;

              let timerTextClass = 'text-emerald-400 drop-shadow-[0_0_8px_rgba(52,211,153,0.3)]';
              let timerBoxClass = 'bg-slate-950/90 border-slate-800/90';

              if (isTimeout) {
                timerTextClass = 'text-red-400 font-extrabold';
                timerBoxClass = 'animate-timeout-box border-red-500';
              } else if (elapsed >= 3300) {
                timerTextClass = 'text-red-500 animate-urgent font-extrabold';
                timerBoxClass = 'bg-red-950/30 border-red-500/80 shadow-[0_0_15px_rgba(239,68,68,0.25)]';
              } else if (elapsed >= 3000) {
                timerTextClass = 'text-amber-300 drop-shadow-[0_0_12px_rgba(251,191,36,0.75)]';
                timerBoxClass = 'bg-amber-950/25 border-amber-500/70 shadow-[0_0_12px_rgba(245,158,11,0.2)]';
              } else if (st.status === 'idle' && elapsed === 0) {
                timerTextClass = 'text-slate-400';
              }

              const autoIdx = getAutoStageIndex(room, elapsed);
              const isManualMode = st.manualStageIndex !== -1 && st.manualStageIndex !== undefined;
              const activeStageIdx = isManualMode
                ? Math.min(room.stages.length - 1, Math.max(0, st.manualStageIndex))
                : autoIdx;
              const currentStage = room.stages[activeStageIdx] || room.stages[0];

              const handleNextStage = () => {
                const nextIdx = (activeStageIdx + 1) % room.stages.length;
                updateRoomState(room.id, { manualStageIndex: nextIdx });
              };

              const handlePrevStage = () => {
                const prevIdx = (activeStageIdx - 1 + room.stages.length) % room.stages.length;
                updateRoomState(room.id, { manualStageIndex: prevIdx });
              };

              const handleRestoreAuto = () => {
                updateRoomState(room.id, { manualStageIndex: -1 });
              };

              return (
                <section
                  key={room.id}
                  className={`flex flex-col rounded-xl bg-slate-900/90 border-2 ${room.theme.border} ${room.theme.glow} overflow-hidden lg:h-full`}
                >
                  <div className={`px-3 py-2.5 border-b border-slate-800/80 flex items-center justify-between gap-1 ${room.theme.headerBg}`}>
                    <h2 className={`text-base xl:text-lg font-black tracking-wide truncate ${room.theme.accentText}`}>
                      {room.name}
                    </h2>
                    <span
                      className={`shrink-0 px-2 py-0.5 rounded text-[11px] font-bold border ${
                        isTimeout
                          ? 'bg-red-600 text-white border-red-400 animate-pulse'
                          : isRunning
                          ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50'
                          : isPaused
                          ? 'bg-amber-500/20 text-amber-300 border-amber-500/50'
                          : 'bg-slate-800 text-slate-400 border-slate-700'
                      }`}
                    >
                      {isTimeout ? '時間到' : isRunning ? '計時中' : isPaused ? '暫停中' : '未開始'}
                    </span>
                  </div>

                  <div className={`mx-2 mt-2 px-2 py-2.5 rounded-lg border transition-all flex flex-col items-center justify-center relative ${timerBoxClass}`}>
                    <div className="flex items-center justify-between w-full px-1">
                      <button
                        onClick={() => handleAdjustMinute(room.id, -1)}
                        className="px-1.5 py-0.5 rounded bg-slate-800/90 hover:bg-slate-700 text-slate-400 hover:text-slate-200 text-[11px] font-mono-timer border border-slate-700/70 transition"
                        title="減少 1 分鐘"
                      >
                        -1m
                      </button>

                      <div className={`font-mono-timer text-3xl xl:text-4xl font-extrabold tracking-tight leading-none ${timerTextClass}`}>
                        {formatMMSS(elapsed)}
                      </div>

                      <button
                        onClick={() => handleAdjustMinute(room.id, 1)}
                        className="px-1.5 py-0.5 rounded bg-slate-800/90 hover:bg-slate-700 text-slate-400 hover:text-slate-200 text-[11px] font-mono-timer border border-slate-700/70 transition"
                        title="增加 1 分鐘"
                      >
                        +1m
                      </button>
                    </div>

                    {isTimeout && (
                      <div className="mt-1 text-xs font-black tracking-widest text-red-200 bg-red-600/90 px-2.5 py-0.5 rounded animate-bounce">
                        60:00 【時間到】
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-5 gap-1.5 px-2 mt-2">
                    <button
                      onClick={() => handleToggleStartPause(room.id)}
                      disabled={isTimeout}
                      className={`col-span-3 py-2 rounded-lg font-bold text-xs xl:text-sm flex items-center justify-center gap-1 transition shadow-sm ${
                        isTimeout
                          ? 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                          : isRunning
                          ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-[0_0_12px_rgba(245,158,11,0.3)]'
                          : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-[0_0_12px_rgba(16,185,129,0.3)]'
                      }`}
                    >
                      {isRunning ? '⏸ 暫停' : elapsed > 0 ? '▶ 繼續' : '▶ 開始'}
                    </button>

                    <button
                      onClick={() => setResetConfirmRoomId(room.id)}
                      className="col-span-2 py-2 rounded-lg font-bold text-xs xl:text-sm bg-rose-950/90 hover:bg-rose-600 text-rose-200 hover:text-white border border-rose-700/70 transition flex items-center justify-center"
                    >
                      ↺ 重置
                    </button>
                  </div>

                  <div className="flex-1 flex flex-col mx-2 my-2 p-2.5 rounded-lg bg-slate-950/80 border border-slate-800/90 lg:overflow-hidden">
                    <div className="flex items-center justify-between gap-1 pb-2 mb-2 border-b border-slate-800/80 shrink-0">
                      <span
                        className={`text-[11px] font-bold px-1.5 py-0.5 rounded border ${
                          isManualMode
                            ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                            : 'bg-slate-800/90 text-slate-300 border-slate-700'
                        }`}
                      >
                        {isManualMode ? '手動階段' : '自動跟隨'}
                      </span>

                      <span className="text-[11px] font-mono-timer text-slate-400">
                        階段 {activeStageIdx + 1} / {room.stages.length}
                      </span>
                    </div>

                    <div className="flex items-center gap-1 mb-2 shrink-0">
                      {room.stages.map((stItem, idx) => (
                        <button
                          key={idx}
                          onClick={() => updateRoomState(room.id, { manualStageIndex: idx })}
                          title={`切換至 ${stItem.range}`}
                          className={`h-1.5 flex-1 rounded-full transition-all ${
                            idx === activeStageIdx
                              ? room.theme.dotActive
                              : idx < activeStageIdx
                              ? 'bg-slate-600'
                              : 'bg-slate-800'
                          }`}
                        />
                      ))}
                    </div>

                    {isManualMode && (
                      <button
                        onClick={handleRestoreAuto}
                        className="mb-2 py-1 px-2 rounded bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/50 text-amber-300 text-[11px] font-bold transition shrink-0 flex items-center justify-center gap-1"
                      >
                        ⚡ 還原自動跟隨時間
                      </button>
                    )}

                    <div className="mb-2 shrink-0 flex items-center justify-between">
                      <span className={`inline-block text-xs font-extrabold px-2 py-0.5 rounded border ${room.theme.badgeBg}`}>
                        ⏱ {currentStage.range}
                      </span>
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-1.5 pr-0.5">
                      {currentStage.items.map((itemText, i) => (
                        <div
                          key={i}
                          className="p-2 rounded bg-slate-900/95 border border-slate-800/90 text-slate-100 text-xs xl:text-[13px] leading-relaxed font-medium break-words"
                        >
                          {itemText}
                        </div>
                      ))}
                    </div>

                    <div className="pt-2 mt-2 border-t border-slate-800/80 grid grid-cols-3 gap-1.5 shrink-0">
                      <button
                        onClick={handlePrevStage}
                        className="col-span-1 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold border border-slate-700 transition"
                      >
                        ◀ 上一個
                      </button>
                      <button
                        onClick={handleNextStage}
                        className="col-span-2 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-white text-[11px] xl:text-xs font-bold border border-slate-600 transition"
                      >
                        下一個提示 ▶
                      </button>
                    </div>
                  </div>
                </section>
              );
            })}
          </main>

          {resetConfirmRoomId && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border-2 border-rose-500/70 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
                <h3 className="text-lg font-black text-white flex items-center gap-2">
                  <span className="text-rose-500">⚠️</span> 確認結束並重置？
                </h3>
                <p className="mt-2 text-sm text-slate-300 leading-relaxed">
                  確認要結束並重置「
                  <span className="font-bold text-white">
                    {ROOMS_DATA.find((r) => r.id === resetConfirmRoomId)?.name}
                  </span>
                  」嗎？重置後時間將歸零為 <span className="font-mono-timer text-rose-400 font-bold">00:00</span>，且所有連線裝置會同步歸零。
                </p>
                <div className="mt-5 flex items-center justify-end gap-2.5">
                  <button
                    onClick={() => setResetConfirmRoomId(null)}
                    className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold border border-slate-700 transition"
                  >
                    取消
                  </button>
                  <button
                    onClick={confirmResetRoom}
                    className="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-sm font-bold shadow-[0_0_15px_rgba(225,29,72,0.4)] transition"
                  >
                    確認重置歸零
                  </button>
                </div>
              </div>
            </div>
          )}

          {showSyncModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-base font-black text-white">
                    ☁️ Firebase 連線狀態
                  </h3>
                  <button
                    onClick={() => setShowSyncModal(false)}
                    className="text-slate-400 hover:text-white text-sm font-bold px-2 py-1"
                  >
                    ✕
                  </button>
                </div>

                <div className="mt-4 space-y-3 text-xs text-slate-300 leading-relaxed">
                  <p>
                    目前已成功綁定您的專案：<code className="text-cyan-300">escertimer</code>
                  </p>
                  {syncErrorMsg ? (
                    <div className="p-2.5 rounded-lg bg-red-950/80 border border-red-500/60 text-red-200 text-xs">
                      ⚠️ {syncErrorMsg}
                    </div>
                  ) : (
                    <div className="p-2.5 rounded-lg bg-emerald-950/80 border border-emerald-500/60 text-emerald-200 text-xs">
                      ✅ 資料庫連線正常！請確認您在 Firebase Console 的 Realtime Database「規則 (Rules)」已設為讀寫皆可（<code className="text-white">".read": true, ".write": true</code>）。
                    </div>
                  )}
                </div>

                <div className="mt-5 flex items-center justify-end">
                  <button
                    onClick={() => setShowSyncModal(false)}
                    className="px-4 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-black transition"
                  >
                    確定
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
